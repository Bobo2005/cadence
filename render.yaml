services:
  - type: web
    name: cadence-notifications
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd notifications && npm install && npm run build
    startCommand: cd notifications && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: DATA_DIR
        value: ./data
      - key: CLIENT_URL
        value: https://cadence-protocol.vercel.app
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CADENCE_INTERNAL_API_KEY
        generateValue: true
      # Optional: Set RESEND_API_KEY and SMTP_FROM in the Render dashboard for live inbox dispatch
