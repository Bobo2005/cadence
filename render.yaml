services:
  - type: web
    name: cadence-notifications
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd notifications && npm install && npm run build
    startCommand: cd notifications && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: DATA_DIR
        value: ./data
